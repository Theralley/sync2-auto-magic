name: tests

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: macos-latest  # macOS is the system tried in a car; the tests build small C helpers with clang
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: sync2-auto-magic
      # The tests read fixtures from a SyncExtPack clone next to this one; it is never modified.
      - name: Fetch SyncExtPack at the tested commit
        run: |
          git init -q syncextpack
          git -C syncextpack remote add origin https://github.com/chr0m1ng/syncextpack
          git -C syncextpack fetch -q --depth 1 origin 1a1eda00aea2d319dc850b6e7a118c67ebd3e0de
          git -C syncextpack checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependencies
        run: python3 -m pip install --quiet Pillow
      - name: Unit tests
        working-directory: sync2-auto-magic
        run: python3 -m unittest discover -s tests

  # Linux (#5) and Windows (#6) are new and not yet tried with a real stick. These runs show what
  # breaks there; they may fail without failing the workflow until they are made required.
  other-systems:
    name: unit (${{ matrix.os }}, new)
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: sync2-auto-magic
      - name: Fetch SyncExtPack at the tested commit
        run: |
          git init -q syncextpack
          git -C syncextpack remote add origin https://github.com/chr0m1ng/syncextpack
          git -C syncextpack fetch -q --depth 1 origin 1a1eda00aea2d319dc850b6e7a118c67ebd3e0de
          git -C syncextpack checkout -q FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test dependencies
        run: python -m pip install --quiet Pillow
      - name: Unit tests
        working-directory: sync2-auto-magic
        run: python -m unittest discover -s tests
